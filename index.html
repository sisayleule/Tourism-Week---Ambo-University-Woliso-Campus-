<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tourism Week — Ambo University Woliso Campus</title>
    <meta name="description" content="Official public website for the Annual Tourism Week celebration at Ambo University, Woliso Campus, Department of Tourism and Hotel Management." />

    <!-- Open Graph -->
    <meta property="og:title" content="Tourism Week — Ambo University Woliso Campus" />
    <meta property="og:description" content="5th Annual Tourism Celebration · Tourism for Peace and Stability · Woliso Campus, Oromia, Ethiopia" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/assets/share/default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tourism Week, Ambo University Woliso Campus" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tourism Week — Ambo University Woliso Campus" />
    <meta name="twitter:image" content="/assets/share/default.jpg" />

    <!-- Favicon: Tourism Week logo (website logo, image 4) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/tourism-week-logo.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/tourism-week-logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/tourism-week-logo.png" />

    <!-- Preconnect to Supabase so the first live-content fetch has a warm connection -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />

    <!--
      Theme-init: runs before first paint to eliminate any flash.
      Loaded synchronously (no defer/async) so it executes before the
      browser paints. Using an external file keeps CSP script-src to 'self'.
    -->
    <script src="/theme-init.js"></script>
  </head>
  <body class="bg-[#FAF7F0] text-[#14201A] dark:bg-[#0B1612] dark:text-[#E8EFEA] antialiased selection:bg-[#D9A441]/30 selection:text-[#0F3D2E] min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
